name: Terraform

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -diff -recursive

      - name: Initialize PADE module
        working-directory: modules/pade
        run: terraform init -upgrade -backend=false

      - name: Validate PADE module
        working-directory: modules/pade
        run: terraform validate

      - name: Test PADE module
        working-directory: modules/pade
        run: terraform test -verbose

      - name: Initialize RC → PADE bindings module
        working-directory: modules/rc-pade-bindings
        run: terraform init -upgrade -backend=false

      - name: Validate RC → PADE bindings module
        working-directory: modules/rc-pade-bindings
        run: terraform validate

      - name: Test RC → PADE bindings module
        working-directory: modules/rc-pade-bindings
        run: terraform test -verbose

      - name: ShellCheck module scripts
        run: |
          shellcheck --severity=warning modules/pade/scripts/install.sh.tftpl
          shellcheck --severity=warning modules/rc-pade-bindings/scripts/bind.sh.tftpl

      - name: Check Experiment 001 smoke shell syntax
        run: bash -n experiments/001-gce-broker/run.sh

  installer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun x tsc --noEmit

      - name: Check formatting
        run: |
          bun x prettier --write .
          git diff --exit-code

      - name: Run installer tests
        run: bun test
